; DollmanMute runtime config.
; build.ps1 does not overwrite an existing game-root DollmanMute.ini.
; If a key is missing in your game-root ini, core_main.c falls back to code defaults.
; EnableVoiceMute=1 mutes known Dollman gameplay voice lines.
; EnableSubtitleMute=1 mutes Dollman gameplay subtitles.
; EnableDialogueTickMute=1 (default) uses the unified single-point mode: one hook on
;   the per-frame dialogue tick (sub_140387A80) mutes Dollman voice+subtitle together,
;   gated by starttalk_flags so private-room / story dialogue stays audible.
;   0 falls back to the legacy two-chain voice+subtitle hooks.
; EnableSignMute=1 mutes player sign (road-sign) jingles/cheers.
;   Default 0 (off) - experimental, not yet extensively tested.
; F8 marks a fresh probe session window in DollmanMute.log.
; F7 toggles the sign mute at runtime (for A/B listening).
; ScannerMode=0 keeps scanner audio unchanged.
; ScannerMode=1 reduces scanner intensity.
; ScannerMode=2 fully mutes scanner audio.

[General]
Enabled=1
VerboseLog=0
EnableVoiceMute=1
EnableSubtitleMute=1
EnableDialogueTickMute=1
EnableSignMute=0
ScannerMode=0
